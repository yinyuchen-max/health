services:
  mysql:
    image: mysql:8.0
    container_name: health-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: health_system
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库 schema 不再通过 initdb.d 初始化，改由后端启动时 Flyway 自动迁移
      # （backend/src/main/resources/db/migration/V1-V5）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    container_name: health-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: "--appendonly yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    container_name: health-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: health-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/health_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HEALTH_RAG_REDIS_HOST: redis
      HEALTH_RAG_REDIS_PORT: 6379
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-text-embedding-v4}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:80}"
      MAIL_HOST: "${MAIL_HOST:-smtp.qq.com}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_USERNAME: "${MAIL_USERNAME:-2212169296@qq.com}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-vprekpwostsvecij}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-admin123}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: health-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"      # 域名直连：HTTP（ACME 验证 + IP 直连）
      - "443:443"    # 域名直连：HTTPS（需在安全组放行 443）
    volumes:
      # Let's Encrypt 证书与 webroot 验证目录（certbot 容器写入，nginx 只读）
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: health-cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro


volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
