server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: healthsystemsecretkey-healthsystemsecretkey-2026
  expiration: 86400000

langchain4j:
  openai:
    chat-api-key: ${DEEPSEEK_API_KEY:}
    embedding-api-key: ${DASHSCOPE_API_KEY:}
    model-name: deepseek-v4-flash
    base-url: https://api.deepseek.com/v1
    embedding-model-name: ${EMBEDDING_MODEL_NAME:text-embedding-v4}
    embedding-base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    temperature: 0.3
    timeout: 60
  fallback:
    enabled: true
    ai-timeout-ms: 3000

rag:
  health:
    vector-store-path: ${HEALTH_RAG_VECTOR_STORE_PATH:data/rag/health-knowledge-vector-store.json}

logging:
  level:
    com.health: DEBUG
    org.springframework.security: DEBUG
    dev.langchain4j: INFO
