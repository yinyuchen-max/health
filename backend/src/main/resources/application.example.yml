server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
  error:
    include-message: never
    include-binding-errors: never

# CORS 跨域配置（多个源用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,https://zpew.top,https://api.zpew.top}

spring:
  config:
    # 支持从外层工作区、项目根目录或 backend 目录启动；当前目录的 .env 优先。
    import:
      - "optional:file:./health/.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:3306/health_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "${MYSQL_ROOT_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 1800000        # 连接最大存活 30 分钟（须小于 MySQL wait_timeout）
      keepalive-time: 300000       # 每 5 分钟发送心跳保活，防止被 MySQL 断开
      connection-test-query: SELECT 1
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000         # 空闲连接 10 分钟后回收

  # Flyway 数据库迁移：应用启动时自动执行 classpath:db/migration 下的版本化脚本
  # baseline-on-migrate: 对已存在数据的旧库自动打基线（视为已应用到 baseline-version），不重跑历史脚本
  # 全新空库则从 V1 开始依次执行全部迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '5'
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: "${RABBITMQ_PASS}"
    listener:
      simple:
        concurrency: 1
        max-concurrency: 3
        prefetch: 2
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
          multiplier: 2

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:--}
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        transport:
          protocol: smtp

# 提醒调度配置
reminder:
  scheduler:
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    check-interval-ms: ${REMINDER_CHECK_INTERVAL:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: "${JWT_SECRET}"
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  issuer: ${JWT_ISSUER:health-system}
  audience: ${JWT_AUDIENCE:health-clients}

ai:
  service-url: ${AI_SERVICE_URL:http://127.0.0.1:8081}
  service-secret: ${AI_SERVICE_SECRET}
  payment:
    enabled: ${AI_PAYMENT_ENABLED:false}
    public-base-url: ${PAYMENT_PUBLIC_BASE_URL:}
    plus-cents: ${AI_PLUS_CENTS:990}
    pro-cents: ${AI_PRO_CENTS:1990}
    promax-cents: ${AI_PROMAX_CENTS:2990}
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_PAY_APP_ID:}
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
      public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    alipay:
      enabled: ${ALIPAY_ENABLED:false}
      app-id: ${ALIPAY_APP_ID:}
      seller-id: ${ALIPAY_SELLER_ID:}
      private-key-path: ${ALIPAY_PRIVATE_KEY_PATH:}
      public-key-path: ${ALIPAY_PUBLIC_KEY_PATH:}
  platform:
    provider: ${AI_PLATFORM_PROVIDER:deepseek}
    model: ${AI_PLATFORM_MODEL:deepseek-flash}
    api-key: ${AI_PLATFORM_API_KEY:}
    revision: ${AI_PLATFORM_REVISION:1}

langchain4j:
  fallback:
    enabled: true
    ai-timeout-ms: 65000

# 微信小程序配置
wechat:
  miniapp:
    app-id: ${WECHAT_APP_ID:--}
    app-secret: "${WECHAT_APP_SECRET:}"
    # 订阅消息模板 ID（在小程序后台配置后填入）
    subscribe-template-id: ${WECHAT_SUBSCRIBE_TEMPLATE_ID:}

logging:
  level:
    com.health: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    dev.langchain4j: INFO

# 业务字典：默认加载包内文件，可替换为 file:/opt/health/departments.yml。
medical:
  departments:
    resource: ${DEPARTMENTS_RESOURCE:classpath:catalogs/departments.yml}

# 可调运行策略；Duration 使用 7d、15m、60s 等格式，修改后重启后端。
health:
  memory:
    max-semantic-memories: ${MEMORY_MAX_SEMANTIC_MEMORIES:500}
    max-episodes: ${MEMORY_MAX_EPISODES:2000}
    recall-limit: ${MEMORY_RECALL_LIMIT:8}
    embedding-revision: ${MEMORY_EMBEDDING_REVISION:1}
    archived-retention-days: ${MEMORY_ARCHIVED_RETENTION_DAYS:90}
    dispatch-delay-ms: ${MEMORY_DISPATCH_DELAY_MS:3000}
    maintenance-delay-ms: ${MEMORY_MAINTENANCE_DELAY_MS:600000}
  # 所有用户共享的 API 入口保护，单实例并发上限预留数据库后台任务余量。
  traffic-protection:
    enabled: ${TRAFFIC_PROTECTION_ENABLED:true}
    requests-per-second: ${TRAFFIC_REQUESTS_PER_SECOND:50}
    burst-capacity: ${TRAFFIC_BURST_CAPACITY:50}
    max-concurrent-requests: ${TRAFFIC_MAX_CONCURRENT_REQUESTS:16}
    redis-key: ${TRAFFIC_REDIS_KEY:rate:limit:global:api}
  runtime:
    chat-memory:
      # 兼容旧配置；在线聊天现按 AI 服务完整 token 预算压缩，不按条数截断。
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
      context-record-limit: ${CHAT_CONTEXT_RECORD_LIMIT:5}
      ttl: ${CHAT_MEMORY_TTL:7d}
    async:
      core-pool-size: ${ASYNC_CORE_POOL_SIZE:0}
      max-pool-size: ${ASYNC_MAX_POOL_SIZE:0}
      queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
      keep-alive: ${ASYNC_KEEP_ALIVE:60s}
      shutdown-wait: ${ASYNC_SHUTDOWN_WAIT:60s}
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
