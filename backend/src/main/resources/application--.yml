server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      force-request: true
      force-response: true
  error:
    include-message: never
    include-binding-errors: never

# CORS 跨域配置（多个源用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/health_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: --
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000
          multiplier: 2

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:--}
    password: ${MAIL_PASSWORD:--}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        transport:
          protocol: smtp

# 提醒调度配置
reminder:
  scheduler:
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    check-interval-ms: ${REMINDER_CHECK_INTERVAL:60000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: healthsystemsecretkey-healthsystemsecretkey-2026
  expiration: 86400000

langchain4j:
  openai:
    chat-api-key: ${DEEPSEEK_API_KEY:--}
    embedding-api-key: ${DASHSCOPE_API_KEY:--}
    model-name: deepseek-v4-flash
    base-url: https://api.deepseek.com/v1
    embedding-model-name: ${EMBEDDING_MODEL_NAME:qwen3.7-text-embedding}
    embedding-base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    temperature: 0.3
    timeout: 60
  fallback:
    enabled: true
    ai-timeout-ms: 60000

rag:
  health:
    vector-store-path: ${HEALTH_RAG_VECTOR_STORE_PATH:data/rag/health-knowledge-vector-store.json}
    redis:
      host: ${HEALTH_RAG_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${HEALTH_RAG_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${HEALTH_RAG_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${HEALTH_RAG_REDIS_DATABASE:0}
      key-prefix: ${HEALTH_RAG_REDIS_KEY_PREFIX:health:knowledge}
      lock-ttl: ${HEALTH_RAG_REDIS_LOCK_TTL:120s}
      lock-wait: ${HEALTH_RAG_REDIS_LOCK_WAIT:2s}

logging:
  level:
    com.health: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    dev.langchain4j: INFO
