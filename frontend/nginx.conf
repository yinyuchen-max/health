# ========== 全局（http 上下文）==========
# 域名请求强制跳转 HTTPS；IP 直连保持 HTTP 可用（便于内网/调试）
map $host $redirect_to_https {
    default      0;
    zpew.top     1;
    api.zpew.top 1;
}

# gzip 压缩：大幅减少移动端/公网下载的 JS/CSS 体积
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# ========== HTTP (80) ==========
# 职责：Let's Encrypt 证书签发/续期验证、IP 直连、域名 301 到 HTTPS
server {
    listen 80;
    server_name zpew.top api.zpew.top 47.239.48.70 localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt HTTP-01 验证路径（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        if ($redirect_to_https) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出（AI 对话）需要的代理配置
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# ========== HTTPS (443) 主站 ==========
server {
    listen 443 ssl;
    http2 on;
    server_name zpew.top;

    # 证书路径为固定符号链接：
    # 容器启动时入口脚本自动指向 Let's Encrypt 正式证书，
    # 未签发前指向镜像内置自签兜底证书，保证 nginx 始终可启动
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出（AI 对话）需要的代理配置
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# ========== HTTPS (443) API 域名 ==========
# 供微信小程序/第三方调用，替代原 Cloudflare Tunnel 的 api.zpew.top 入口
server {
    listen 443 ssl;
    http2 on;
    server_name api.zpew.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 保留原始 URI 转发（小程序请求带 /api 前缀）
    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
