      email: 'demo@health-system.com',
      phone: '13800000000',
      gender: 1,
      age: 24,
      height: 175,
      weight: 69.5,
      status: 1
    };

    localStorage.setItem('token', 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJkZW1vX3VzZXIiLCJyb2xlIjoidXNlciJ9.c2lnbmF0dXJl');
    localStorage.setItem('userInfo', JSON.stringify(userInfo));
    window.location.replace(target);
  </script>
</body>
</html>
